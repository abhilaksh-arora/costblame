<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>costblame</title>
<style>
  :root {
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --plane: #f5f0e3; --surface: #fdfbf5; --surface2: #efe6d2; --surface3: #e6dabd;
    --ink: #2a2420; --ink2: #6b5d47; --muted: #998a6d;
    --grid: #e6dbbf; --baseline: #d6c6a0; --ring: rgba(42,36,32,.11);
    --seq: #a15f2c; --seq-strong: #7c4820; --seq-wash: rgba(161,95,44,.15);
    --good: #4a6b32; --good-solid: #5c7a3f; --bad: #a23c2e;
    --p-claude: #a15f2c; --p-codex: #5c7a6e; --p-gemini: #7a5a7e; --p-other: #998a6d;
    --shadow-sm: 0 1px 2px rgba(42,36,32,.05);
    --shadow: 0 1px 3px rgba(42,36,32,.06), 0 8px 24px -8px rgba(42,36,32,.12);
    --shadow-lg: 0 2px 6px rgba(42,36,32,.08), 0 18px 40px -12px rgba(42,36,32,.18);
    --r: 14px; --r-sm: 10px;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --plane: #171209; --surface: #201a11; --surface2: #2b2316; --surface3: #392e1c;
      --ink: #f3e9d6; --ink2: #cbb999; --muted: #98876a;
      --grid: #2f2617; --baseline: #473a24; --ring: rgba(255,244,222,.09);
      --seq: #d68a4a; --seq-strong: #e8a05e; --seq-wash: rgba(214,138,74,.18);
      --good: #83a85e; --good-solid: #83a85e; --bad: #d97a63;
      --p-claude: #d68a4a; --p-codex: #86a68f; --p-gemini: #ab8bae; --p-other: #98876a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.5);
      --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 50px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --plane: #171209; --surface: #201a11; --surface2: #2b2316; --surface3: #392e1c;
    --ink: #f3e9d6; --ink2: #cbb999; --muted: #98876a;
    --grid: #2f2617; --baseline: #473a24; --ring: rgba(255,244,222,.09);
    --seq: #d68a4a; --seq-strong: #e8a05e; --seq-wash: rgba(214,138,74,.18);
    --good: #83a85e; --good-solid: #83a85e; --bad: #d97a63;
    --p-claude: #d68a4a; --p-codex: #86a68f; --p-gemini: #ab8bae; --p-other: #98876a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.5);
    --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 50px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    margin: 0; color: var(--ink);
    background:
      radial-gradient(1100px 460px at 88% -8%, color-mix(in srgb, var(--seq) 8%, transparent), transparent 60%),
      var(--plane);
    font: 13.5px/1.6 var(--mono);
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px 96px; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 15px 0 13px; margin-bottom: 20px;
    background: color-mix(in srgb, var(--plane) 78%, transparent);
    backdrop-filter: saturate(1.5) blur(14px);
    border-bottom: 1px solid var(--ring);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(145deg, var(--seq), var(--seq-strong));
    box-shadow: 0 2px 8px -1px color-mix(in srgb, var(--seq) 55%, transparent);
    display: grid; place-items: center;
  }
  .brand .mark svg { width: 15px; height: 15px; color: #fff; }
  .brand h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .brand .tag { color: var(--muted); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; margin-top: 2px; }
  .scope { color: var(--muted); font-size: 12px; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }
  .iconbtn, button.act {
    font: inherit; font-weight: 600; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--ring); border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; transition: .16s;
    box-shadow: var(--shadow-sm);
  }
  button.act { padding: 8px 14px; }
  .iconbtn { padding: 8px; }
  .iconbtn:hover, button.act:hover { color: var(--ink); border-color: color-mix(in srgb, var(--seq) 55%, var(--ring)); box-shadow: var(--shadow); }
  .iconbtn svg, button.act svg { width: 15px; height: 15px; }
  #refresh.spin svg { animation: spin .7s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- loading overlay ---------- */
  .loading-overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--plane) 55%, transparent); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .loading-overlay.show { opacity: 1; pointer-events: auto; }
  .loading-box {
    background: var(--surface); border: 1px solid var(--ring); border-radius: var(--r-sm);
    box-shadow: var(--shadow-lg); padding: 14px 20px; display: flex; align-items: center; gap: 11px;
    color: var(--ink2); font-weight: 600; font-size: 12.5px;
  }
  .spinner { width: 15px; height: 15px; border-radius: 50%; flex: none; border: 2px solid var(--ring); border-top-color: var(--seq); animation: spin .7s linear infinite; }

  .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .ov-top .figure { font-size: 48px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; margin: 8px 0 2px; }
  .ov-top .figure .cents { color: var(--muted); font-weight: 640; font-size: .62em; letter-spacing: -.02em; }
  .planline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 620;
    padding: 5px 11px; border-radius: 999px;
  }
  .chip.good { color: #fff; background: var(--good-solid); }
  .chip.ghost { color: var(--ink2); background: var(--surface2); border: 1px solid var(--ring); }

  /* ---------- kpi tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--r-sm); box-shadow: var(--shadow-sm); padding: 15px 16px; }
  .tile .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .tile .k .d { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .tile .v { font-size: 25px; font-weight: 670; margin-top: 6px; letter-spacing: -.025em; }
  .tile .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

  /* ---------- section shell ---------- */
  .panel { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 22px; }
  .phd { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 22px 6px; }
  .phd h2 { font-size: 11px; font-weight: 700; margin: 0; letter-spacing: .09em; text-transform: uppercase; color: var(--ink2); }
  .phd .hint { color: var(--muted); font-size: 11.5px; }
  .ov-div { border-top: 1px solid var(--ring); }

  /* ---------- overview hero (nested, no own border/shadow) ---------- */
  .ov-top { padding: 26px 28px 4px; position: relative; overflow: hidden; }
  .ov-top::after {
    content: ""; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px;
    background: radial-gradient(circle, var(--seq-wash), transparent 68%); pointer-events: none;
  }

  /* ---------- ROI callout ---------- */
  .roi-wrap { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; padding: 6px 22px 20px; }
  @media (max-width: 760px) { .roi-wrap { grid-template-columns: 1fr; } }
  .roi-box { background: var(--surface2); border: 1px solid var(--ring); border-left: 3px solid var(--seq); border-radius: 12px; padding: 18px 20px; }
  .roi-box .lbl { color: var(--seq-strong); font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .roi-box hr { border: none; border-top: 2px solid var(--seq); width: 26px; margin: 11px 0 12px; }
  .roi-box p { margin: 0; line-height: 1.6; }
  .roi-box .fine { color: var(--muted); font-size: 11.5px; margin-top: 13px; }
  .statcol { display: flex; flex-direction: column; gap: 14px; }
  .statcol .s .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .statcol .s .v { font-size: 17px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* ---------- code-impact top row: dual bar + mini stats ---------- */
  .impact-top { display: flex; flex-wrap: wrap; gap: 24px; padding: 8px 22px 6px; }
  .impact-top .dualbar { flex: 1 1 300px; }
  .impact-mini { display: flex; gap: 22px; flex: 0 0 auto; }
  .im { padding-right: 20px; border-right: 1px solid var(--grid); }
  .im:last-child { padding-right: 0; border-right: none; }
  .im .v { font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .im .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }

  /* ---------- dual/diverging bar & meter (bar-chart marks) ---------- */
  .dualbar-row { display: grid; grid-template-columns: 62px 1fr 56px; align-items: center; gap: 10px; margin-top: 8px; }
  .dualbar-row:first-child { margin-top: 0; }
  .dualbar-row .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .dualbar-row .track { height: 10px; border-radius: 5px; background: var(--surface3); overflow: hidden; }
  .dualbar-row .track i { display: block; height: 100%; border-radius: 5px; }
  .dualbar-row .val { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .dualbar-row .val.add { color: var(--good); }
  .dualbar-row .val.rem { color: var(--bad); }
  .meter .mhead { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .meter .mhead b { color: var(--ink); font-weight: 700; font-size: 12.5px; text-transform: none; letter-spacing: 0; }
  .meter .mtrack { height: 10px; border-radius: 5px; background: var(--surface3); overflow: hidden; }
  .meter .mtrack i { display: block; height: 100%; border-radius: 5px; background: var(--seq); }
  .capnote { color: var(--muted); font-size: 11px; margin-top: 5px; }

  /* ---------- provider filter bar ---------- */
  .filterrow { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .filterrow .flabel { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }

  /* ---------- time chart ---------- */
  .seg-ctrl { display: inline-flex; gap: 2px; background: var(--surface2); border: 1px solid var(--ring); border-radius: 10px; padding: 3px; }
  .seg-ctrl button { font: inherit; font-size: 12px; font-weight: 560; color: var(--muted); background: transparent; border: none; padding: 5px 11px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: .14s; }
  .seg-ctrl button .d { width: 8px; height: 8px; border-radius: 3px; }
  .seg-ctrl button:hover { color: var(--ink); }
  .seg-ctrl button.on { color: var(--ink); background: var(--surface); box-shadow: var(--shadow-sm); }
  .tl-legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 2px 22px 0; min-height: 15px; }
  .tl-legend .lg { display: inline-flex; align-items: center; gap: 7px; color: var(--ink2); font-size: 12px; font-weight: 540; }
  .tl-legend .lg .ln { width: 15px; height: 3px; border-radius: 2px; }
  .chartbox { position: relative; padding: 12px 22px 8px; }
  .plot { position: relative; width: 100%; height: 210px; }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .ytick { position: absolute; left: 0; color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; transform: translateY(-50%); background: color-mix(in srgb, var(--surface) 78%, transparent); padding-right: 4px; }
  .xaxis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; padding: 8px 2px 4px; font-variant-numeric: tabular-nums; }
  .crossline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--baseline); opacity: 0; pointer-events: none; }
  .crossdot { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--seq); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--seq); opacity: 0; pointer-events: none; transform: translate(-50%, -50%); }

  /* ---------- provider stacked bar ---------- */
  .provbox { padding: 16px 22px 20px; }
  .stack { display: flex; gap: 2px; height: 34px; }
  .stack .seg { height: 100%; border-radius: 4px; min-width: 3px; transition: filter .12s, transform .12s; cursor: default; }
  .stack .seg:hover { filter: brightness(1.07); }
  .stack .seg:first-child { border-radius: 8px 4px 4px 8px; }
  .stack .seg:last-child { border-radius: 4px 8px 8px 4px; }
  .plegend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 16px; }
  .pl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 9px; padding: 10px 13px; border: 1px solid var(--ring); border-radius: 10px; background: var(--surface2); flex: 1 1 170px; }
  .pl .sw { width: 11px; height: 11px; border-radius: 4px; flex: none; }
  .pl .nm { font-weight: 600; text-transform: capitalize; }
  .pl .amt { font-weight: 660; font-variant-numeric: tabular-nums; text-align: right; }
  .pl .meta { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }

  /* ---------- project list ---------- */
  .prow { border-top: 1px solid var(--grid); cursor: pointer; transition: background .12s; }
  .prow:first-child { border-top: none; }
  .prow:hover { background: color-mix(in srgb, var(--seq) 4%, transparent); }
  .phead { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 13px; padding: 14px 20px; }
  .chev { color: var(--muted); transition: transform .18s; display: inline-flex; }
  .prow.open .chev { transform: rotate(90deg); }
  .pname { font-weight: 590; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .pdots { display: inline-flex; gap: 3px; }
  .pdots i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .psub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pcost { text-align: right; }
  .pcost .amt { font-weight: 660; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .pcost .share { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .track { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--surface3); overflow: hidden; margin-top: 3px; }
  .fill { height: 100%; background: linear-gradient(90deg, var(--seq), var(--seq-strong)); border-radius: 4px; }
  .detail { grid-column: 1 / -1; padding: 8px 4px 14px; animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  .dgrid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .dgrid { grid-template-columns: 1fr; } }
  .dcard { background: var(--surface2); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px 16px; }
  .subh { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 650; margin: 0 0 8px; }
  .subh.gap { margin-top: 18px; }

  .mrow { padding: 9px 0; border-top: 1px solid var(--grid); }
  .mrow:first-of-type { border-top: none; padding-top: 2px; }
  .mtop { display: flex; align-items: baseline; gap: 8px; }
  .mtop .nm { font-weight: 570; display: inline-flex; align-items: center; gap: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtop .nm .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .mtop .amt { margin-left: auto; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .mtop .pct { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .msub { color: var(--muted); font-size: 11px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .mbar { height: 5px; border-radius: 3px; background: var(--surface3); overflow: hidden; margin-top: 7px; }
  .mbar i { display: block; height: 100%; border-radius: 3px; }
  .seeall {
    font: inherit; font-size: 11.5px; font-weight: 600; color: var(--seq-strong);
    background: none; border: none; padding: 10px 0 2px; cursor: pointer; width: 100%; text-align: left;
  }
  .seeall:hover { text-decoration: underline; }

  .dbars { display: flex; align-items: flex-end; gap: 3px; height: 92px; margin-top: 4px; border-bottom: 1px solid var(--baseline); }
  .dbars .d { flex: 1 1 0; max-width: 20px; min-width: 3px; background: linear-gradient(180deg, var(--seq), var(--seq-strong)); border-radius: 3px 3px 0 0; opacity: .9; transition: opacity .1s; }
  .dbars .d:hover { opacity: 1; }
  .daxl { display: flex; justify-content: space-between; color: var(--muted); font-size: 10.5px; margin-top: 7px; font-variant-numeric: tabular-nums; }

  .empty { padding: 64px; text-align: center; color: var(--muted); }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface2); padding: 1.5px 6px; border-radius: 6px; }
  .meta { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }

  #tip {
    position: fixed; pointer-events: none; z-index: 60; opacity: 0; transition: opacity .1s;
    background: var(--ink); color: var(--plane); font-size: 12px; font-weight: 560;
    padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -145%);
    box-shadow: var(--shadow-lg);
  }
  #tip .t2 { opacity: .7; font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 4-6"/></svg></span>
      <span><h1>costblame</h1><div class="tag">Dashboard</div></span>
    </span>
    <div class="scope" id="scope"></div>
    <span class="spacer"></span>
    <button class="iconbtn" id="theme" title="Toggle theme" aria-label="Toggle theme"></button>
    <button class="act" id="refresh" title="Reload from current logs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg>
      Refresh
    </button>
  </header>

  <div id="filterbar"></div>
  <div id="overview"></div>
  <div id="body"></div>
  <div class="meta" id="meta"></div>
</div>
<div id="tip"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-box"><span class="spinner"></span>Loading report…</div></div>

<script>
const $ = (s) => document.querySelector(s);
const tip = $("#tip");
let CURRENT = null;

/* ---------- formatting ---------- */
function money(n) { return "$" + n.toFixed(2); }
function moneyRich(n) {
  const s = n.toFixed(2), [d, c] = s.split(".");
  return `$${Number(d).toLocaleString()}<span class="cents">.${c}</span>`;
}
function compact(n) {
  if (n >= 1e9) return (n/1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "K";
  return String(n);
}
function tokens(n) { return compact(n); }
function totalTokens(t) { return t.input + t.output + t.cache_create + t.cache_read; }
function span(a, b) {
  if (!a || !b || a.startsWith("0001")) return "–";
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h" + (m % 60) + "m";
  return Math.floor(h / 24) + "d" + (h % 24) + "h";
}
function showTip(e, html) { tip.innerHTML = html; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.style.opacity = 1; }
function hideTip() { tip.style.opacity = 0; }

const PROV = { claude: "var(--p-claude)", codex: "var(--p-codex)", gemini: "var(--p-gemini)" };
const provColor = (n) => PROV[n] || "var(--p-other)";
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- bar-chart marks: dual bar (diverging) & meter ---------- */
function dualBarRow(label, val, colorVar, max, cls, sign) {
  const pct = Math.max(2, Math.abs(val) / max * 100);
  return `<div class="dualbar-row">
    <span class="lbl">${label}</span>
    <span class="track"><i style="width:${pct}%;background:${colorVar}"></i></span>
    <span class="val ${cls}">${sign}${compact(Math.abs(val))}</span>
  </div>`;
}
function meterBar(label, pct, valueLabel) {
  return `<div class="meter">
    <div class="mhead"><span>${label}</span><b>${valueLabel}</b></div>
    <div class="mtrack"><i style="width:${Math.max(2, pct)}%"></i></div>
  </div>`;
}

/* ---------- overview: hero + tiles + code impact + plan ROI, one panel ---------- */
function renderOverview(rep) {
  const filtered = FILTER !== "all";
  const s = filtered ? activeStat(rep) : null;
  const cost = filtered ? (s ? s.totals.cost : 0) : rep.totals.cost;
  const share = filtered && rep.totals.cost ? (cost / rep.totals.cost * 100).toFixed(0) : 0;

  const eyebrow = filtered
    ? `<span class="d" style="display:inline-block;width:8px;height:8px;border-radius:3px;background:${provColor(FILTER)};margin-right:6px"></span>${cap(FILTER)} spend · at API list price`
    : `Total value consumed · at API list price`;
  const planLine = (!filtered && rep.plan) || (FILTER === "claude" && rep.plan)
    ? `<div class="planline">
        <span class="chip good"${filtered ? ` style="background:${provColor('claude')}"` : ""}>▲ ${rep.plan.multiplier.toFixed(1)}× your plan</span>
        <span class="chip ghost">${cap(rep.plan.name)} · ${rep.plan.price_label}</span>
      </div>`
    : filtered
      ? `<div class="planline"><span class="chip ghost">${cap(FILTER)} · API / pay-as-you-go · ${share}% of total</span></div>`
      : `<div class="planline"><span class="chip ghost">API / pay-as-you-go</span></div>`;

  const view = projView(rep);
  const t = filtered ? (s ? s.totals : { input: 0, output: 0, cache_create: 0, cache_read: 0, cost: 0 }) : rep.totals;
  const sess = filtered ? (s ? s.sessions : 0) : rep.sessions;
  const firstTile = filtered
    ? `<div class="tile"><div class="k"><span class="d" style="background:${provColor(FILTER)}"></span>Provider</div><div class="v">${cap(FILTER)}</div><div class="sub">filtered view</div></div>`
    : `<div class="tile"><div class="k">${(rep.providers || []).map(p => `<span class="d" style="background:${provColor(p.provider)}"></span>`).join("")}Providers</div><div class="v">${(rep.providers || []).length}</div><div class="sub">${(rep.providers || []).map(p => cap(p.provider)).join(" · ")}</div></div>`;
  const tiles = firstTile +
    `<div class="tile"><div class="k">Projects</div><div class="v">${view.length}</div></div>` +
    `<div class="tile"><div class="k">Sessions</div><div class="v">${sess}</div></div>` +
    `<div class="tile"><div class="k">Total tokens</div><div class="v">${tokens(totalTokens(t))}</div><div class="sub">${tokens(t.cache_read)} cache read</div></div>` +
    `<div class="tile"><div class="k">Output tokens</div><div class="v">${tokens(t.output)}</div></div>`;

  const a = rep.activity;
  const showActivity = (FILTER === "all" || FILTER === "claude") && a && (a.edits || a.tool_calls);
  let impactHtml = "", roiHtml = "";

  if (showActivity) {
    const files = rep.files || [];
    const churnHotspots = files.filter(f => f.edits > 1).length;
    const cacheEff = cacheEfficiency(t);
    const maxLR = Math.max(a.lines_added, a.lines_removed, 1);
    const linesBars = `<div class="dualbar">
        ${dualBarRow("Added", a.lines_added, "var(--good)", maxLR, "add", "+")}
        ${dualBarRow("Removed", a.lines_removed, "var(--bad)", maxLR, "rem", "−")}
      </div>`;
    const mini = `<div class="impact-mini">
        <div class="im"><div class="v">${files.length}</div><div class="k">Files touched</div></div>
        <div class="im"><div class="v">${churnHotspots}</div><div class="k">Churn hotspots</div></div>
      </div>`;
    const tile2 = (k, v, sub) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
    const impactTiles = [
      a.edits ? tile2("Cost / edit", "$" + a.cost_per_edit.toFixed(3), `${compact(a.edits)} edits`) : "",
      a.changed_lines ? tile2("Cost / 100 lines", "$" + a.cost_per_100_lines.toFixed(3), `${compact(a.changed_lines)} changed`) : "",
      a.tool_calls ? tile2("Tool error rate", (a.tool_error_rate * 100).toFixed(1) + "%", `${compact(a.tool_calls)} calls`) : "",
      tile2("Rework loops", a.rework_loops, "same file, same session"),
      tile2("Corrections", a.corrections, "user pushback turns"),
    ].join("");
    impactHtml = `
      <div class="ov-div"></div>
      <div class="phd"><h2>Code impact, not token volume</h2><span class="hint">what the tokens bought</span></div>
      <div class="impact-top">${linesBars}${mini}</div>
      ${cacheEff != null ? `<div style="padding:2px 22px 14px">${meterBar("Cache efficiency · cache-read share of input", cacheEff, cacheEff.toFixed(0) + "%")}</div>` : ""}
      <div class="tiles" style="margin:0;padding:4px 22px 20px">${impactTiles}</div>`;

    const apiEq = cost;
    const costPerEdit = a.edits ? a.cost_per_edit : null;
    const plan = rep.plan;
    const headline = plan
      ? `You consumed <b>${money(apiEq)}</b> of API-equivalent tokens — <b>${plan.multiplier.toFixed(1)}×</b> your flat ${plan.price_label} ${cap(plan.name)} plan.`
      : `You consumed <b>${money(apiEq)}</b> of API-equivalent tokens on an unconfigured plan.`;
    const fine = plan
      ? `${rep.sessions} session${rep.sessions === 1 ? "" : "s"} priced · ${money(rep.sessions ? apiEq / rep.sessions : 0)} / session`
      : `Run <code>costblame configure</code> to compare this against a real plan.`;
    const roiBars = plan
      ? (() => {
          const max = Math.max(apiEq, plan.monthly_usd, 1);
          return `<div class="dualbar" style="margin-top:14px">
            <div class="dualbar-row"><span class="lbl">API equiv</span><span class="track"><i style="width:${Math.max(2, apiEq / max * 100)}%;background:var(--seq)"></i></span><span class="val">${money(apiEq)}</span></div>
            <div class="dualbar-row"><span class="lbl">Plan</span><span class="track"><i style="width:${Math.max(2, plan.monthly_usd / max * 100)}%;background:var(--seq)"></i></span><span class="val">${money(plan.monthly_usd)}/mo</span></div>
          </div>`;
        })()
      : "";
    roiHtml = `
      <div class="ov-div"></div>
      <div class="phd"><h2>Cost intelligence & plan ROI</h2><span class="hint">API-equivalent estimate</span></div>
      <div class="roi-wrap">
        <div class="roi-box">
          <div class="lbl">Return on plan</div>
          <hr>
          <p>${headline}</p>
          <div class="fine">${fine}</div>
        </div>
        <div class="statcol">
          <div class="s"><div class="k">Cost / edit</div><div class="v">${costPerEdit != null ? "$" + costPerEdit.toFixed(3) : "–"}</div></div>
          ${roiBars}
        </div>
      </div>`;
  }

  return `<div class="panel">
    <div class="ov-top">
      <div class="eyebrow">${eyebrow}</div>
      <div class="figure">${moneyRich(cost)}</div>
      ${planLine}
    </div>
    <div class="tiles" style="padding:16px 22px 4px;margin-bottom:8px">${tiles}</div>
    ${impactHtml}
    ${roiHtml}
  </div>`;
}

/* ---------- merged daily series ---------- */
function mergedDaily(rep) {
  const m = {};
  for (const p of rep.projects) for (const d of (p.daily||[])) m[d.date] = (m[d.date]||0) + d.totals.cost;
  return Object.keys(m).sort().map(date => ({ date, cost: m[date] }));
}
function niceCeil(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * mag;
}

/* ---------- global provider filter ---------- */
let FILTER = "all"; // "all" | provider name — drives the whole dashboard
function tlSeries(rep) {
  const provs = (rep.providers || []).map(p => p.provider);
  return FILTER === "all" ? provs : provs.filter(p => p === FILTER);
}
function projView(rep) {
  // returns [{ p, cost, tot, sess }] respecting FILTER, sorted by cost desc
  if (FILTER === "all")
    return rep.projects.map(p => ({ p, cost: p.totals.cost, tot: p.totals, sess: p.sessions }));
  return rep.projects.map(p => {
    const ps = (p.providers || []).find(x => x.provider === FILTER);
    return ps ? { p, cost: ps.totals.cost, tot: ps.totals, sess: ps.sessions } : null;
  }).filter(Boolean).sort((a, b) => b.cost - a.cost);
}
function activeStat(rep) { return (rep.providers || []).find(p => p.provider === FILTER); }
function activeTotal(rep) {
  if (FILTER === "all") return rep.totals.cost;
  const s = activeStat(rep); return s ? s.totals.cost : 0;
}

function renderFilterBar(rep) {
  const provs = (rep.providers || []).map(p => p.provider);
  if (provs.length < 2) { $("#filterbar").innerHTML = ""; return; }
  const btn = (id, label, color) =>
    `<button data-f="${id}" class="${FILTER === id ? "on" : ""}">${color ? `<span class="d" style="background:${color}"></span>` : ""}${label}</button>`;
  $("#filterbar").innerHTML =
    `<div class="filterrow"><span class="flabel">Provider</span>
      <div class="seg-ctrl">${btn("all", "All", "")}${provs.map(p => btn(p, cap(p), provColor(p))).join("")}</div></div>`;
}
function wireFilterBar(rep) {
  document.querySelectorAll("#filterbar [data-f]").forEach(b => {
    b.addEventListener("click", () => { FILTER = b.dataset.f; render(rep); });
  });
}

/* ---------- time chart ---------- */
function renderTimeChart(rep) {
  const tl = rep.timeline || [];
  if (tl.length < 2) return "";
  const hint = FILTER === "all" ? "daily · all providers, API-equiv" : `daily · ${cap(FILTER)} only`;
  return `<div class="panel">
    <div class="phd"><h2>Spend over time</h2><span class="hint">${hint}</span></div>
    <div class="tl-legend" id="tl-legend"></div>
    <div class="chartbox">
      <div class="plot" id="plot"></div>
      <div class="xaxis"><span>${tl[0].date}</span><span>${tl[tl.length-1].date}</span></div>
    </div>
  </div>`;
}
function updateTlLegend(rep) {
  const lg = $("#tl-legend"); if (!lg) return;
  const series = tlSeries(rep);
  lg.innerHTML = series.length > 1
    ? series.map(s => `<span class="lg"><span class="ln" style="background:${provColor(s)}"></span>${cap(s)}</span>`).join("")
    : "";
}
function drawTimeChart(rep) {
  const tl = rep.timeline || [];
  const plot = $("#plot");
  if (!plot || tl.length < 2) return;
  const series = tlSeries(rep);
  const single = series.length === 1;
  const W = plot.clientWidth, H = plot.clientHeight, padT = 14, padB = 4, plotH = H - padT - padB;
  const val = (pt, s) => pt.by_provider[s] || 0;
  let mx = 0;
  for (const pt of tl) for (const s of series) mx = Math.max(mx, val(pt, s));
  const maxY = niceCeil(mx);
  const X = (i) => i / (tl.length - 1) * W;
  const Y = (v) => padT + (1 - v / maxY) * plotH;
  const gy = [0, maxY / 2, maxY];
  const grid = gy.map(v => `<line x1="0" y1="${Y(v)}" x2="${W}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>`).join("");

  let marks = "";
  series.forEach(s => {
    const pts = tl.map((pt, i) => `${X(i)},${Y(val(pt, s))}`).join(" ");
    if (single) {
      const area = `0,${padT + plotH} ${pts} ${W},${padT + plotH}`;
      marks += `<polygon points="${area}" style="fill:${provColor(s)};fill-opacity:.16"/>`;
    }
    marks += `<polyline points="${pts}" fill="none" style="stroke:${provColor(s)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  });

  plot.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${marks}</svg>
    ${gy.map(v => `<span class="ytick" style="top:${Y(v)}px">$${v >= 1000 ? (v/1000).toFixed(0)+'k' : v}</span>`).join("")}
    <div class="crossline" id="cl"></div>
    <div id="cdots"></div>`;

  const cl = $("#cl"), cdots = $("#cdots");
  cdots.innerHTML = series.map(s => `<div class="crossdot" style="background:${provColor(s)};box-shadow:0 0 0 1px ${provColor(s)}"></div>`).join("");
  const dots = [...cdots.children];
  plot.onmousemove = (e) => {
    const r = plot.getBoundingClientRect();
    const i = Math.max(0, Math.min(tl.length - 1, Math.round((e.clientX - r.left) / W * (tl.length - 1))));
    const px = X(i);
    cl.style.left = px + "px"; cl.style.opacity = 1;
    series.forEach((s, k) => {
      const d = dots[k]; d.style.left = px + "px"; d.style.top = Y(val(tl[i], s)) + "px"; d.style.opacity = 1;
    });
    const lines = single
      ? money(val(tl[i], series[0]))
      : series.map(s => `<div><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${provColor(s)};margin-right:6px"></span>${cap(s)} ${money(val(tl[i], s))}</div>`).join("");
    showTip(e, `${lines}<div class="t2" style="margin-top:3px">${tl[i].date}</div>`);
  };
  plot.onmouseleave = () => { cl.style.opacity = 0; dots.forEach(d => d.style.opacity = 0); hideTip(); };
}

/* ---------- provider stacked bar ---------- */
function renderProviders(rep) {
  if (FILTER !== "all") return ""; // only one provider in view — nothing to split
  const provs = rep.providers || [];
  if (provs.length < 2) return "";
  const grand = rep.totals.cost || 1;
  const segs = provs.map(p => {
    const w = p.totals.cost / grand * 100;
    return `<div class="seg" style="width:${w}%;background:${provColor(p.provider)}"
      data-tip="${cap(p.provider)}<div class='t2'>${money(p.totals.cost)} · ${w.toFixed(0)}%</div>"></div>`;
  }).join("");
  const legend = provs.map(p => {
    const sh = (p.totals.cost / grand * 100).toFixed(0);
    return `<div class="pl">
      <span class="sw" style="background:${provColor(p.provider)}"></span>
      <span class="nm">${p.provider}</span>
      <span class="amt">${money(p.totals.cost)}</span>
      <span class="meta">${sh}% of total · ${p.sessions} session${p.sessions==1?"":"s"}</span>
    </div>`;
  }).join("");
  return `<div class="panel"><div class="phd"><h2>Spend by provider</h2><span class="hint">Claude plan offsets Claude only</span></div>
    <div class="provbox"><div class="stack">${segs}</div><div class="plegend">${legend}</div></div></div>`;
}

/* ---------- project detail bits (meter rows) ---------- */
function meterRow(name, dotColor, barColor, cost, pct, sub, barPct) {
  const dot = dotColor ? `<span class="dot" style="background:${dotColor}"></span>` : "";
  return `<div class="mrow">
    <div class="mtop"><span class="nm">${dot}${name}</span>
      <span class="amt">${money(cost)}</span><span class="pct">${pct}</span></div>
    <div class="msub">${sub}</div>
    <div class="mbar"><i style="width:${Math.max(2, barPct)}%;background:${barColor}"></i></div>
  </div>`;
}
function providerBreak(p) {
  if (!p.providers || p.providers.length < 2) return "";
  const max = Math.max(...p.providers.map(x => x.totals.cost)) || 1;
  const rows = p.providers.map(x => {
    const t = x.totals;
    const sub = `${tokens(t.input)} in · ${tokens(t.output)} out · ${tokens(t.cache_read)} cache · ${x.sessions} sess`;
    return meterRow(cap(x.provider), provColor(x.provider), provColor(x.provider),
      t.cost, (t.cost / p.totals.cost * 100).toFixed(0) + "%", sub, t.cost / max * 100);
  }).join("");
  return `<div class="subh">By provider</div>${rows}`;
}
function branchBreak(p) {
  const real = p.branches.filter(b => b.branch !== "(n/a)");
  if (!real.length) return "";
  const max = Math.max(...real.map(b => b.totals.cost)) || 1;
  const gap = p.providers && p.providers.length > 1 ? " gap" : "";
  const rows = real.map(b => {
    const t = b.totals;
    const sub = `${tokens(t.input)} in · ${tokens(t.output)} out · ${tokens(t.cache_read)} cache · ${b.sessions} sess · ${span(b.first, b.last)}`;
    return meterRow(b.branch, null, "var(--seq)", t.cost,
      (t.cost / p.totals.cost * 100).toFixed(0) + "%", sub, t.cost / max * 100);
  }).join("");
  return `<div class="subh${gap}">Claude branches</div>${rows}`;
}
function dailyMini(p) {
  if (!p.daily || p.daily.length < 2)
    return `<div class="subh">Daily cost</div><div class="msub">Single day · ${money(p.totals.cost)}</div>`;
  const max = Math.max(...p.daily.map(d => d.totals.cost)) || 1;
  const bars = p.daily.map(d =>
    `<div class="d" style="height:${Math.max(4, d.totals.cost / max * 100)}%" data-tip="${money(d.totals.cost)}<div class='t2'>${d.date}</div>"></div>`).join("");
  return `<div class="subh">Daily cost</div><div class="dbars">${bars}</div>
    <div class="daxl"><span>${p.daily[0].date}</span><span>${p.daily[p.daily.length - 1].date}</span></div>`;
}
function provDots(p) {
  if (!p.providers || p.providers.length < 2) return "";
  return `<span class="pdots">${p.providers.map(x =>
    `<i style="background:${provColor(x.provider)}" title="${cap(x.provider)} ${money(x.totals.cost)}"></i>`).join("")}</span>`;
}

function projectDetail(p) {
  // Filtered to one provider: show that provider's branches (Claude) or a
  // compact summary; the whole-project daily strip would mix providers, so skip.
  if (FILTER !== "all") {
    const br = FILTER === "claude" ? branchBreak(p) : "";
    const ps = (p.providers || []).find(x => x.provider === FILTER);
    const t = ps ? ps.totals : p.totals;
    const summary = `<div class="subh">${cap(FILTER)} usage</div>
      <div class="msub">${tokens(t.input)} in · ${tokens(t.output)} out · ${tokens(t.cache_read)} cache read${ps ? " · " + ps.sessions + " sess" : ""}</div>`;
    return `<div class="detail"><div class="dcard">${summary}${br}</div></div>`;
  }
  const left = providerBreak(p) + branchBreak(p);
  if (!left.trim()) return `<div class="detail"><div class="dcard">${dailyMini(p)}</div></div>`;
  return `<div class="detail"><div class="dgrid">
    <div class="dcard">${left}</div>
    <div class="dcard">${dailyMini(p)}</div>
  </div></div>`;
}

/* ---------- code activity (Claude-only: edits, files, tools) ---------- */
function cacheEfficiency(t) {
  if (!t || (t.input + t.cache_read) <= 0) return null;
  return t.cache_read / (t.input + t.cache_read) * 100;
}
function fileRow(f, maxChanged) {
  const changed = f.lines_added + f.lines_removed;
  const name = f.path.split("/").pop();
  return `<div class="mrow" data-tip="${f.path}">
    <div class="mtop"><span class="nm">${name}</span>
      <span class="amt">${f.edits} edit${f.edits === 1 ? "" : "s"}</span></div>
    <div class="msub">+${f.lines_added} / -${f.lines_removed} · ${f.sessions} session${f.sessions === 1 ? "" : "s"}</div>
    <div class="mbar"><i style="width:${Math.max(2, changed / maxChanged * 100)}%;background:var(--seq)"></i></div>
  </div>`;
}
function toolRow(t, maxCalls) {
  const errPct = t.calls ? (t.errors / t.calls * 100) : 0;
  const errNote = t.errors > 0 ? ` · ${errPct.toFixed(0)}% errored` : "";
  return `<div class="mrow">
    <div class="mtop"><span class="nm">${t.name}</span><span class="amt">${t.calls}</span></div>
    <div class="msub">${t.calls} call${t.calls === 1 ? "" : "s"}${errNote}</div>
    <div class="mbar"><i style="width:${Math.max(2, t.calls / maxCalls * 100)}%;background:${t.errors > 0 ? "var(--bad)" : "var(--seq)"}"></i></div>
  </div>`;
}
let filesExpanded = false, toolsExpanded = false;
function renderFilesTools(rep) {
  if (FILTER !== "all" && FILTER !== "claude") return ""; // edit/tool data is Claude-only
  const files = rep.files || [], tools = rep.tools || [];
  if (!files.length && !tools.length) return "";

  const maxChanged = Math.max(...files.map(f => f.lines_added + f.lines_removed), 1);
  const maxCalls = Math.max(...tools.map(x => x.calls), 1);
  const seeAll = (id, total, expanded) => total > 5
    ? `<button class="seeall" data-toggle="${id}">${expanded ? "Show less" : `See all ${total}`}</button>` : "";
  const filesShown = filesExpanded ? files : files.slice(0, 5);
  const toolsShown = toolsExpanded ? tools : tools.slice(0, 5);
  const filesCard = files.length ? `<div class="dcard"><div class="subh">Most-touched files</div>${filesShown.map(f => fileRow(f, maxChanged)).join("")}${seeAll("files", files.length, filesExpanded)}</div>` : "";
  const toolsCard = tools.length ? `<div class="dcard"><div class="subh">Tool calls</div>${toolsShown.map(x => toolRow(x, maxCalls)).join("")}${seeAll("tools", tools.length, toolsExpanded)}</div>` : "";

  return `<div class="panel">
    <div class="phd"><h2>Files & tool calls</h2><span class="hint">Claude only</span></div>
    <div class="dgrid" style="padding:0 22px 20px">${filesCard}${toolsCard}</div>
  </div>`;
}

/* ---------- projects panel ---------- */
let expanded = new Set();
let projectsExpanded = false;
function renderProjects(rep) {
  const view = projView(rep);
  if (!view.length) return '<div class="panel"><div class="empty">No usage for this provider.</div></div>';
  const maxCost = Math.max(...view.map(v => v.cost)) || 1;
  const grand = activeTotal(rep) || 1;
  const hd = FILTER === "all" ? "Cost by project" : `Cost by project · ${cap(FILTER)}`;
  const shown = projectsExpanded ? view : view.slice(0, 7);
  const seeAllBtn = view.length > 7
    ? `<div class="prow"><button class="seeall" data-toggle="projects" style="padding:14px 20px">${projectsExpanded ? "Show less" : `See all ${view.length}`}</button></div>`
    : "";
  const rows = shown.map(({ p, cost, tot, sess }) => {
    const open = expanded.has(p.project);
    const w = (cost / maxCost * 100).toFixed(1);
    const share = (cost / grand * 100).toFixed(0);
    const provNote = FILTER !== "all" ? cap(FILTER)
      : (p.providers && p.providers.length > 1) ? p.providers.map(x => cap(x.provider)).join(" + ")
      : (p.providers && p.providers[0] ? cap(p.providers[0].provider) : "");
    const dots = FILTER === "all" ? provDots(p) : "";
    const fillBg = FILTER === "all" ? "" : `background:${provColor(FILTER)}`;
    return `<div class="prow ${open ? "open" : ""}" data-key="${encodeURIComponent(p.project)}">
      <div class="phead">
        <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        <div style="min-width:0">
          <div class="pname">${p.project}${dots}</div>
          <div class="psub">${provNote} · ${sess} session${sess==1?"":"s"} · ${tokens(totalTokens(tot))} tokens</div>
        </div>
        <div class="pcost"><div class="amt">${money(cost)}</div><div class="share">${share}% of total</div></div>
        <div class="track"><div class="fill" style="width:${w}%;${fillBg}"></div></div>
        ${open ? projectDetail(p) : ``}
      </div>
    </div>`;
  }).join("");
  return `<div class="panel"><div class="phd"><h2>${hd}</h2><span class="hint">click a row to expand</span></div><div>${rows}${seeAllBtn}</div></div>`;
}

/* ---------- top-level render ---------- */
function render(rep) {
  CURRENT = rep;
  const provTxt = FILTER === "all" ? "all providers" : cap(FILTER) + " only";
  $("#scope").textContent = rep.projects.length === 1 ? rep.projects[0].project
    : rep.projects.length + " projects · " + provTxt;
  $("#meta").textContent = "updated " + new Date(rep.generated_at).toLocaleString() + " · pricing " + rep.pricing;

  renderFilterBar(rep); wireFilterBar(rep);
  $("#overview").innerHTML = renderOverview(rep);
  $("#body").innerHTML = renderTimeChart(rep) + renderProviders(rep) + renderProjects(rep) + renderFilesTools(rep);
  updateTlLegend(rep); drawTimeChart(rep);

  // wire interactions
  document.querySelectorAll(".prow").forEach(row => {
    const head = row.querySelector(".phead");
    if (!head) return; // the "see all" row has no .phead — nothing to wire
    head.addEventListener("click", (e) => {
      if (e.target.closest(".detail")) return;
      const k = decodeURIComponent(row.dataset.key);
      expanded.has(k) ? expanded.delete(k) : expanded.add(k);
      render(rep);
    });
  });
  document.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const k = btn.dataset.toggle;
      if (k === "files") filesExpanded = !filesExpanded;
      else if (k === "tools") toolsExpanded = !toolsExpanded;
      else if (k === "projects") projectsExpanded = !projectsExpanded;
      render(rep);
    });
  });
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", (e) => showTip(e, el.dataset.tip));
    el.addEventListener("mouseleave", hideTip);
  });
}

/* ---------- theme ---------- */
function initTheme() {
  const btn = $("#theme");
  const sun = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const moon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
  const apply = (t) => {
    document.documentElement.setAttribute("data-theme", t);
    btn.innerHTML = t === "dark" ? sun : moon;
    if (CURRENT) drawTimeChart(CURRENT); // recolor chart to new theme vars
  };
  let cur = localStorage.getItem("cb-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  apply(cur);
  btn.addEventListener("click", () => {
    cur = cur === "dark" ? "light" : "dark";
    localStorage.setItem("cb-theme", cur); apply(cur);
  });
}

/* ---------- load ---------- */
async function load() {
  const btn = $("#refresh"); btn.classList.add("spin"); setTimeout(() => btn.classList.remove("spin"), 700);
  $("#loadingOverlay").classList.add("show");
  try {
    const res = await fetch("/api/report");
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
  } catch (e) {
    $("#body").innerHTML = '<div class="panel"><div class="empty">Failed to load report. Is <code>costblame serve</code> running?</div></div>';
  } finally {
    $("#loadingOverlay").classList.remove("show");
  }
}

initTheme();
$("#refresh").addEventListener("click", load);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => CURRENT && drawTimeChart(CURRENT), 150); });
load();
</script>
</body>
</html>
